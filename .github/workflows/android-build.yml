name: Android - APK e AAB assinado
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar HTML e sintaxe do JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          assert '<canvas' in html and 'const heroes=' in html and '<script>' in html
          script=re.search(r'<script>([\s\S]*?)</script>', html)
          assert script, 'Script de arena não encontrado'
          Path('/tmp/lendas-game.js').write_text(script.group(1))
          ET.parse('app/src/main/AndroidManifest.xml')
          print('Assets e XML OK')
          PY
          node --check /tmp/lendas-game.js
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android API 36 com SDK preinstalado no GitHub
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Enviar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Lendas-da-Ruptura-APK-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Compilar AAB de release sem assinatura para etapa de assinatura local
        run: gradle --no-daemon :app:bundleRelease
      - name: Disponibilizar AAB SEM ASSINATURA (não enviar à Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: Lendas-da-Ruptura-AAB-NAO-ASSINADO
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Compilar AAB release somente com assinatura estável
        id: release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "AAB não gerado: faltam 4 segredos de assinatura."
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release-upload.jks
          chmod 600 release-upload.jks
          export UPLOAD_KEYSTORE_PATH="$GITHUB_WORKSPACE/release-upload.jks"
          gradle --no-daemon :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Enviar AAB assinado
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lendas-da-Ruptura-AAB-Play-Console
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Apagar chave temporária
        if: always()
        run: rm -f release-upload.jks
