name: Lendas 3D — APK Android para testes
on:
  push:
    branches: [feature/arena-3d-multiplayer]
    paths:
      - 'online/game3d/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar Godot 4.5.2 e modelos de exportação Android
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.2-stable_linux.x86_64
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp /tmp/templates/android_debug.apk /tmp/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
      - name: Preparar Android SDK e keystore DEBUG temporária
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses >/dev/null) || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' 'platforms;android-36'
          keytool -genkeypair -noprompt -keystore /tmp/lendas-debug.jks -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/lendas-debug.jks' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          echo "JAVA_SDK=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Configurar SDK Android nas preferências do Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF_SETTINGS
      - name: Importar projeto 3D
        run: /tmp/Godot_v4.5.2-stable_linux.x86_64 --headless --path online/game3d --editor --quit
      - name: Exportar APK debug Android
        run: |
          mkdir -p online/game3d/build
          /tmp/Godot_v4.5.2-stable_linux.x86_64 --headless --path online/game3d --export-debug 'Android Teste 3D' build/Lendas-da-Ruptura-3D-alpha.apk
          test -s online/game3d/build/Lendas-da-Ruptura-3D-alpha.apk
      - name: Enviar APK de teste aos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Lendas-da-Ruptura-3D-APK-alpha
          path: online/game3d/build/Lendas-da-Ruptura-3D-alpha.apk
          if-no-files-found: error
      - name: Publicar APK 3D na página de versões (pré-alfa)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v0.2.0-3d-alpha >/dev/null 2>&1 || gh release create v0.2.0-3d-alpha --target "$GITHUB_SHA" --title 'Lendas da Ruptura — 3D pré-alfa' --prerelease --notes 'Teste 3D com treino offline. Servidor e 1x1 precisam ser hospedados para acesso pela internet; a versão NÃO é um MOBA 5x5 completo. APK de depuração para ARM64, não adequado para Play Console.'
          gh release upload v0.2.0-3d-alpha online/game3d/build/Lendas-da-Ruptura-3D-alpha.apk --clobber
      - name: Apagar keystore temporária
        if: always()
        run: rm -f /tmp/lendas-debug.jks
